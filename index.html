<style>
:root{
  --bg:#f4f2ee; --card:#fff; --ink:#1b1d22; --muted:#7a7d86; --line:#e6e2da;
  --boris:#2f6bff; --job:#12a36b; --mama:#e8743b;
  --ok:#12a36b; --no:#d94141; --radius:16px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);font-family:"Plus Jakarta Sans",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.app{max-width:560px;margin:0 auto;min-height:100vh;padding:16px 14px 110px}

/* header */
header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:38px;height:38px;border-radius:12px;background:var(--ink);display:grid;place-items:center}
.brand h1{font-size:18px;font-weight:800;letter-spacing:-.02em}
.brand small{display:block;font-size:12px;color:var(--muted);font-weight:500}
.me{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);padding:6px 10px 6px 6px;border-radius:999px;font-weight:600;font-size:14px}
.dot{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:12px;font-weight:700}

.banner{background:#fff6dc;border:1px solid #f1dd9b;color:#6b5510;font-size:13px;padding:10px 12px;border-radius:12px;margin-bottom:12px}

/* tabs */
.tabs{display:grid;grid-template-columns:repeat(3,1fr);background:#e9e5dd;border-radius:14px;padding:4px;margin-bottom:14px}
.tab{padding:9px 6px;border-radius:10px;font-weight:600;font-size:14px;color:var(--muted);position:relative}
.tab.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.badge{position:absolute;top:3px;right:8px;background:var(--no);color:#fff;font-size:11px;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;padding:0 5px;font-weight:700}

/* month */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px}
.mhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.mhead h2{font-size:17px;font-weight:700;text-transform:capitalize}
.nav{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);display:grid;place-items:center;font-size:18px}
.nav:disabled{opacity:.3}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.wd{font-size:11px;font-weight:600;color:var(--muted);text-align:center;padding:4px 0}
.day{aspect-ratio:1/1.15;border-radius:10px;border:1px solid transparent;background:#faf9f6;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:5px 3px 5px;position:relative}
.day.empty{background:none}
.day.today{border-color:var(--ink)}
.day.sel{background:#eef3ff;border-color:var(--boris)}
.day .n{font-size:13px;font-weight:600}
.day.past .n{color:#b6b3ab}
.bars{display:flex;flex-direction:column;gap:2px;width:100%;padding:0 2px}
.bar{height:5px;border-radius:3px;background:#e7e3da}
.bar.pend{background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.6) 0 3px,transparent 3px 6px)}
.bar.pick{background:var(--ink)}
.legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:12px;font-size:12px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:14px;height:6px;border-radius:3px;display:inline-block}

/* lists */
.sect{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:18px 4px 8px}
.req{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:10px}
.req .top{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.req .who{font-weight:700}
.req .when{font-size:12px;color:var(--muted)}
.slots{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.chip{font-size:12px;font-weight:600;background:#f2efe9;border-radius:999px;padding:5px 10px}
.note{font-size:14px;color:#444;background:#faf9f6;border-radius:10px;padding:8px 10px;margin:6px 0}
.votes{display:flex;gap:8px;flex-wrap:wrap;font-size:12px;margin-top:6px}
.vote{display:flex;align-items:center;gap:5px;padding:4px 8px;border-radius:999px;background:#f2efe9}
.vote.yes{background:#e3f6ee;color:#0b7a4f}
.vote.no{background:#fbe6e6;color:#b23131}
.status{margin-left:auto;font-size:12px;font-weight:700;padding:4px 9px;border-radius:999px}
.st-pend{background:#fff3d6;color:#8a6510}
.st-ok{background:#e3f6ee;color:#0b7a4f}
.st-no{background:#fbe6e6;color:#b23131}
.st-cx{background:#eee;color:#777}
.actions{display:flex;gap:8px;margin-top:10px}
.btn{flex:1;padding:12px;border-radius:12px;font-weight:700;font-size:15px}
.btn.pri{background:var(--ink);color:#fff}
.btn.ok{background:var(--ok);color:#fff}
.btn.no{background:#fff;border:1.5px solid var(--no);color:var(--no)}
.btn.ghost{background:#f2efe9}
.btn:disabled{opacity:.5}
.emptytxt{color:var(--muted);font-size:14px;text-align:center;padding:24px 10px}

/* selection bar */
.selbar{position:fixed;left:50%;transform:translateX(-50%);bottom:16px;width:calc(100% - 28px);max-width:532px;background:var(--ink);color:#fff;border-radius:16px;padding:10px 10px 10px 16px;display:flex;align-items:center;gap:10px;box-shadow:0 10px 30px rgba(0,0,0,.25);z-index:20}
.selbar b{font-size:15px}
.selbar small{display:block;color:#b9bcc5;font-size:12px}
.selbar .btn{flex:none;padding:10px 14px;font-size:14px}
.selbar .btn.pri{background:#fff;color:var(--ink)}
.selbar .btn.ghost{background:rgba(255,255,255,.12);color:#fff}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(20,20,25,.45);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:18px 16px 24px;max-height:88vh;overflow:auto;animation:up .2s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.5}to{transform:none;opacity:1}}
.sheet h3{font-size:18px;font-weight:800;margin-bottom:4px;text-transform:capitalize}
.sheet p.sub{color:var(--muted);font-size:13px;margin-bottom:14px}
.slotrow{display:flex;align-items:center;gap:12px;border:1.5px solid var(--line);border-radius:14px;padding:12px;margin-bottom:8px;width:100%;text-align:left}
.slotrow.free:hover{border-color:#cfc9bd}
.slotrow.picked{border-color:var(--ink);background:#f7f6f2}
.slotrow .ic{width:38px;height:38px;border-radius:11px;background:#f2efe9;display:grid;place-items:center;font-size:18px;flex:none}
.slotrow .t{font-weight:700}
.slotrow .s{font-size:12px;color:var(--muted)}
.slotrow .chk{margin-left:auto;width:24px;height:24px;border-radius:7px;border:2px solid #cfc9bd;display:grid;place-items:center;flex:none}
.slotrow.picked .chk{background:var(--ink);border-color:var(--ink);color:#fff}
.slotrow.taken{cursor:default}
.tag{margin-left:auto;font-size:12px;font-weight:700;padding:4px 9px;border-radius:999px;color:#fff;flex:none}
.items{display:flex;flex-direction:column;gap:6px;margin:6px 0}
.item{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.inote{font-size:13px;color:#555}
.pnote{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;font:inherit;font-size:15px;margin:-2px 0 10px}
.pnote:focus{outline:none;border-color:var(--ink)}
.sendrow{margin-bottom:4px}
.sendrow .chip{display:inline-block;margin-bottom:6px}
textarea{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;font:inherit;font-size:15px;min-height:80px;resize:vertical;margin:8px 0 14px}
textarea:focus{outline:none;border-color:var(--ink)}

/* login */
.login{min-height:80vh;display:flex;flex-direction:column;justify-content:center;gap:14px}
.login h2{font-size:26px;font-weight:800;letter-spacing:-.02em}
.login p{color:var(--muted)}
.pick{display:flex;align-items:center;gap:14px;background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:14px;font-weight:700;font-size:17px;width:100%}
.pick .dot{width:40px;height:40px;font-size:16px}

.pushic{width:32px;height:32px;border-radius:10px;background:#f2efe9;display:grid;place-items:center}
.toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 16px;border-radius:12px;font-size:14px;font-weight:600;z-index:50;box-shadow:0 8px 24px rgba(0,0,0,.2);max-width:92%;text-align:center}
.loading{color:var(--muted);font-size:13px;text-align:center;padding:8px}
</style>
</head>

<script>
const PEOPLE = ["Boris","Job","Mama"];
const COLOR = {Boris:"var(--boris)",Job:"var(--job)",Mama:"var(--mama)"};
const SLOTS = [
  {k:"ochtend",label:"Ochtend",time:"06:00 – 12:00",ic:"🌅"},
  {k:"middag", label:"Middag", time:"12:00 – 18:00",ic:"☀️"},
  {k:"avond",  label:"Avond",  time:"18:00 – 00:00",ic:"🌙"}
];
const MONTHS = ["januari","februari","maart","april","mei","juni","juli","augustus","september","oktober","november","december"];
const WD = ["ma","di","wo","do","vr","za","zo"];
const YEAR = 2026;

const ls = {
  get(k){try{return localStorage.getItem(k)}catch(e){return null}},
  set(k,v){try{localStorage.setItem(k,v)}catch(e){}}
};

const now = new Date();
const state = {
  me: PEOPLE.includes(ls.get("auto.me")) ? ls.get("auto.me") : null,
  tab: "agenda",
  month: now.getFullYear()===YEAR ? now.getMonth() : 0,
  requests: [],         // {id, by, items:[{d,s}], note, approvals:{name:"yes"|"no"}, cancelled, created}
  picked: [],           // [{d,s}]
  sheet: null,          // {type:"day", d} | {type:"send"} | {type:"confirm", ...}
  db: null, mode: "loading", loadNote: false, busy: false
};
let localStore = [];
let seenIds = null;

/* ---------- helpers ---------- */
const pad = n => String(n).padStart(2,"0");
const ymd = (y,m,d) => `${y}-${pad(m+1)}-${pad(d)}`;
const todayStr = ymd(now.getFullYear(),now.getMonth(),now.getDate());
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function fmtDate(d,long){
  const [y,m,dd]=d.split("-").map(Number); const dt=new Date(y,m-1,dd);
  const wd=["zondag","maandag","dinsdag","woensdag","donderdag","vrijdag","zaterdag"][dt.getDay()];
  return long ? `${wd} ${dd} ${MONTHS[m-1]}` : `${wd.slice(0,2)} ${dd} ${MONTHS[m-1].slice(0,3)}`;
}
const slotLabel = k => SLOTS.find(s=>s.k===k).label;
const others = who => PEOPLE.filter(p=>p!==who);
function statusOf(r){
  if(r.cancelled) return "cancelled";
  const a=r.approvals||{}; const o=others(r.by);
  if(o.some(p=>a[p]==="no")) return "rejected";
  if(o.every(p=>a[p]==="yes")) return "approved";
  return "pending";
}
const active = r => ["pending","approved"].includes(statusOf(r));
function slotOwner(d,s){
  for(const r of state.requests){
    if(!active(r)) continue;
    if((r.items||[]).some(it=>it.d===d&&it.s===s)) return {r, st:statusOf(r)};
  }
  return null;
}
const isPicked = (d,s) => state.picked.some(p=>p.d===d&&p.s===s);
const waitingForMe = () => state.requests.filter(r=>r.by!==state.me && statusOf(r)==="pending" && !(r.approvals||{})[state.me]);
function sortItems(items){return [...items].sort((a,b)=>a.d===b.d ? SLOTS.findIndex(x=>x.k===a.s)-SLOTS.findIndex(x=>x.k===b.s) : a.d<b.d?-1:1)}
function groupItems(items){
  return `<div class="items">${sortItems(items).map(it=>`<div class="item"><span class="chip">${fmtDate(it.d)} · ${slotLabel(it.s).toLowerCase()}</span>${it.note?`<span class="inote">${esc(it.note)}</span>`:""}</div>`).join("")}</div>`;
}
function itemOf(r,d,s){ return (r.items||[]).find(it=>it.d===d&&it.s===s); }
function pnoteInput(p){
  return `<input class="pnote" data-pnote="${p.d}|${p.s}" maxlength="200" placeholder="Opmerking voor ${fmtDate(p.d)} · ${slotLabel(p.s).toLowerCase()} (optioneel)" value="${esc(p.note||"")}">`;
}
function toast(msg){
  const t=document.createElement("div");t.className="toast";t.textContent=msg;document.body.appendChild(t);
  setTimeout(()=>t.remove(),2800);
}

/* ---------- data ---------- */
/* Supabase: actief als config.js een url + anonKey zet */
const SB_CFG = window.AUTO_AGENDA_SUPABASE;
const useSupabase = !!(SB_CFG && SB_CFG.url && SB_CFG.anonKey && !/JOUW/.test(SB_CFG.url) && window.supabase);
let sbReloadTimer=null;
async function sbLoad(){
  const sb=state.sb;
  const [rq,vt]=await Promise.all([
    sb.from("requests").select("*").order("created_at",{ascending:true}),
    sb.from("votes").select("*")
  ]);
  if(rq.error||vt.error) throw (rq.error||vt.error);
  const votes={};
  vt.data.forEach(v=>{(votes[v.request_id]=votes[v.request_id]||{})[v.voter]=v.vote});
  state.requests=rq.data.map(r=>({id:r.id,by:r.by_name,items:r.items||[],note:r.note||"",cancelled:r.cancelled,created:r.created_at,approvals:votes[r.id]||{}}));
  state.mode="supabase"; state.loadNote=false;
  notifyNew(); render();
}
function sbReload(){ clearTimeout(sbReloadTimer); sbReloadTimer=setTimeout(()=>sbLoad().catch(()=>{}),250); }
async function initSupabase(){
  state.sb=window.supabase.createClient(SB_CFG.url,SB_CFG.anonKey);
  const timer=setTimeout(()=>{state.loadNote=true;render()},10000);
  try{ await sbLoad(); }catch(e){ toast("Kan de database niet bereiken"); }
  clearTimeout(timer);
  state.sb.channel("auto-agenda")
    .on("postgres_changes",{event:"*",schema:"public",table:"requests"},sbReload)
    .on("postgres_changes",{event:"*",schema:"public",table:"votes"},sbReload)
    .subscribe();
  document.addEventListener("visibilitychange",()=>{ if(!document.hidden) sbReload(); });
}
async function initDb(){
  if(useSupabase) return initSupabase();
  let timer=setTimeout(()=>{state.loadNote=true;render()},10000);
  let db=null;
  try{ db = await window.claude?.use?.("db"); }catch(e){ db=null; }
  if(!db){ clearTimeout(timer); state.mode="local"; state.loadNote=false; render(); return; }
  state.db=db;
  db.collection("requests").onSnapshot(snap=>{
    if(!snap.metadata.fromCache){clearTimeout(timer); state.loadNote=false;}
    state.requests = snap.docs.map(d=>({id:d.id,...d.data()}));
    state.mode="db";
    notifyNew();
    render();
  }, err=>{
    clearTimeout(timer); state.loadNote=false;
    state.mode = state.requests.length ? "db" : "local"; render();
  });
}
function notifyNew(){
  if(!state.me) return;
  const w = waitingForMe().map(r=>r.id);
  if(seenIds===null){ seenIds=new Set(w); return; }
  const fresh = w.filter(id=>!seenIds.has(id));
  fresh.forEach(id=>seenIds.add(id));
  if(fresh.length){
    const r=state.requests.find(x=>x.id===fresh[0]);
    toast(`🔔 Nieuwe aanvraag van ${r.by}`);
  }
}
async function createReq(data){
  if(state.mode==="supabase"){
    const {error}=await state.sb.from("requests").insert({by_name:data.by,items:data.items,note:data.note});
    if(error) throw error; return sbLoad();
  }
  if(state.mode==="db"){ await state.db.collection("requests").add(data); }
  else{ localStore.push({id:"l"+Date.now(),...data}); state.requests=[...localStore]; render(); }
}
async function updateReq(id,patch){
  if(state.mode==="supabase"){
    if(patch.approvals){
      const rows=Object.entries(patch.approvals).map(([voter,vote])=>({request_id:id,voter,vote}));
      const {error}=await state.sb.from("votes").upsert(rows,{onConflict:"request_id,voter"}); if(error) throw error;
    }
    if("cancelled" in patch){
      const {error}=await state.sb.from("requests").update({cancelled:patch.cancelled}).eq("id",id); if(error) throw error;
    }
    return sbLoad();
  }
  if(state.mode==="db"){ await state.db.doc("requests/"+id).update(patch); }
  else{
    const r=localStore.find(x=>x.id===id);
    if(patch.approvals) r.approvals={...(r.approvals||{}),...patch.approvals};
    if("cancelled" in patch) r.cancelled=patch.cancelled;
    state.requests=[...localStore]; render();
  }
}
async function guarded(fn,okMsg){
  if(state.busy) return; state.busy=true; render();
  try{ await fn(); if(okMsg) toast(okMsg); }
  catch(e){ toast(e && /slot_taken/.test(e.message||"") ? "Een dagdeel is net door iemand anders aangevraagd." : e && e.code==="invalid_argument" ? "Je hebt geen schrijfrechten op deze agenda." : "Opslaan lukte niet, probeer opnieuw."); }
  state.busy=false; render();
}

/* ---------- actions ---------- */
function setMe(p){ state.me=p; ls.set("auto.me",p); seenIds=null; notifyNew(); state.picked=[]; state.sheet=null; resyncPush(); render(); }
function togglePick(d,s){
  if(slotOwner(d,s)) return;
  if(isPicked(d,s)) state.picked=state.picked.filter(p=>!(p.d===d&&p.s===s));
  else state.picked.push({d,s,note:""});
  render();
  if(isPicked(d,s)) setTimeout(()=>document.querySelector(`[data-pnote="${d}|${s}"]`)?.focus(),30);
}
function sendRequest(){
  const note=(document.getElementById("note")?.value||"").trim().slice(0,300);
  const clash = state.picked.find(p=>slotOwner(p.d,p.s));
  if(clash){ toast("Een van je dagdelen is net door iemand anders aangevraagd."); state.picked=state.picked.filter(p=>!slotOwner(p.d,p.s)); render(); return; }
  const items=sortItems(state.picked).map(p=>({d:p.d,s:p.s,note:(p.note||"").trim().slice(0,200)}));
  const data={by:state.me, items, note, approvals:{}, cancelled:false, created:new Date().toISOString()};
  guarded(async()=>{ await createReq(data); state.picked=[]; state.sheet=null; state.tab="mine"; }, `Aanvraag verstuurd naar ${others(state.me).join(" en ")}`);
}
function vote(id,v){
  guarded(()=>updateReq(id,{approvals:{[state.me]:v}}), v==="yes"?"Goedgekeurd 👍":"Afgewezen");
}
function cancel(id){ state.sheet={type:"confirm",id}; render(); }

/* ---------- render ---------- */
function avatar(p,size){ return `<span class="dot" style="background:${COLOR[p]}${size?`;width:${size}px;height:${size}px`:""}">${p[0]}</span>`; }

function renderLogin(){
  return `<div class="login">
    <div class="logo" style="width:52px;height:52px;border-radius:16px">${carSvg(28)}</div>
    <h2>Wie ben jij?</h2>
    <p>Kies je naam om de auto-agenda te gebruiken.</p>
    ${PEOPLE.map(p=>`<button class="pick" data-me="${p}">${avatar(p)} ${p}</button>`).join("")}
  </div>`;
}
function carSvg(s){return `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 17h14M3 13l2-5a2 2 0 0 1 2-1.3h10A2 2 0 0 1 19 8l2 5v4a1 1 0 0 1-1 1h-1M4 18H4a1 1 0 0 1-1-1v-4h18"/><circle cx="7.5" cy="17" r="1.8"/><circle cx="16.5" cy="17" r="1.8"/></svg>`}

function renderMonth(){
  const m=state.month; const first=new Date(YEAR,m,1); const days=new Date(YEAR,m+1,0).getDate();
  const offset=(first.getDay()+6)%7;
  let cells=WD.map(w=>`<div class="wd">${w}</div>`).join("");
  for(let i=0;i<offset;i++) cells+=`<div class="day empty"></div>`;
  for(let d=1;d<=days;d++){
    const ds=ymd(YEAR,m,d);
    const bars=SLOTS.map(s=>{
      if(isPicked(ds,s.k)) return `<div class="bar pick"></div>`;
      const o=slotOwner(ds,s.k);
      if(!o) return `<div class="bar"></div>`;
      return `<div class="bar ${o.st==="pending"?"pend":""}" style="background-color:${COLOR[o.r.by]}"></div>`;
    }).join("");
    const hasPick=state.picked.some(p=>p.d===ds);
    cells+=`<button class="day ${ds===todayStr?"today":""} ${ds<todayStr?"past":""} ${hasPick?"sel":""}" data-day="${ds}"><span class="n">${d}</span><div class="bars">${bars}</div></button>`;
  }
  return `<div class="card">
    <div class="mhead">
      <button class="nav" data-mnav="-1" ${m===0?"disabled":""} aria-label="Vorige maand">‹</button>
      <h2>${MONTHS[m]} ${YEAR}</h2>
      <button class="nav" data-mnav="1" ${m===11?"disabled":""} aria-label="Volgende maand">›</button>
    </div>
    <div class="grid">${cells}</div>
    <div class="legend">
      ${PEOPLE.map(p=>`<span><i style="background:${COLOR[p]}"></i>${p}</span>`).join("")}
      <span><i style="background:#999;background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.6) 0 3px,transparent 3px 6px)"></i>wacht op akkoord</span>
    </div>
  </div>
  <p class="loading" style="margin-top:10px">Tik op een dag om dagdelen te kiezen · balkjes = ochtend / middag / avond</p>`;
}

function reqCard(r, opts={}){
  const st=statusOf(r); const a=r.approvals||{};
  const stMap={pending:["st-pend","Wacht op akkoord"],approved:["st-ok","Goedgekeurd"],rejected:["st-no","Afgewezen"],cancelled:["st-cx","Ingetrokken"]};
  const votes=others(r.by).map(p=>{
    const v=a[p]; return `<span class="vote ${v||""}">${avatar(p,16)} ${p}: ${v==="yes"?"akkoord":v==="no"?"afgewezen":"nog niet"}</span>`;
  }).join("");
  const created=r.created?new Date(r.created):null;
  return `<div class="req">
    <div class="top">${avatar(r.by,32)}<div><div class="who">${esc(r.by)}</div><div class="when">${created?`aangevraagd ${created.getDate()} ${MONTHS[created.getMonth()].slice(0,3)}`:""} · ${(r.items||[]).length} dagde${(r.items||[]).length===1?"el":"len"}</div></div>
      <span class="status ${stMap[st][0]}">${stMap[st][1]}</span></div>
    <div class="slots">${groupItems(r.items||[])}</div>
    ${r.note?`<div class="note">“${esc(r.note)}”</div>`:""}
    <div class="votes">${votes}</div>
    ${opts.vote?`<div class="actions"><button class="btn no" data-vote="no" data-id="${r.id}" ${state.busy?"disabled":""}>Afwijzen</button><button class="btn ok" data-vote="yes" data-id="${r.id}" ${state.busy?"disabled":""}>Goedkeuren</button></div>`:""}
    ${opts.cancel&&active(r)?`<div class="actions"><button class="btn ghost" data-cancel="${r.id}">Intrekken</button></div>`:""}
  </div>`;
}

/* ---------- push ---------- */
const VAPID = SB_CFG && SB_CFG.vapidPublicKey;
const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform==="MacIntel" && navigator.maxTouchPoints>1);
const isStandalone = (window.matchMedia && matchMedia("(display-mode: standalone)").matches) || navigator.standalone===true;
const push = {status:"unsupported", reg:null};
function b64ToU8(s){const p="=".repeat((4-s.length%4)%4);const b=atob((s+p).replace(/-/g,"+").replace(/_/g,"/"));return Uint8Array.from([...b].map(c=>c.charCodeAt(0)));}
async function initPush(){
  if(!useSupabase || !VAPID || /JOUW/.test(VAPID)) { push.status="unsupported"; return; }
  if(isIOS && !isStandalone){ push.status="ios-install"; render(); return; }
  if(!("serviceWorker" in navigator) || !("PushManager" in window) || !("Notification" in window)){ push.status="unsupported"; render(); return; }
  try{ push.reg = await navigator.serviceWorker.register("sw.js"); await navigator.serviceWorker.ready; }
  catch(e){ push.status="unsupported"; render(); return; }
  const sub = await push.reg.pushManager.getSubscription();
  push.status = Notification.permission==="denied" ? "denied" : sub ? "on" : "off";
  if(sub) resyncPush();
  render();
}
async function saveSub(sub){
  const {error} = await state.sb.rpc("save_push_subscription",{p_endpoint:sub.endpoint,p_name:state.me,p_sub:sub.toJSON()});
  if(error) throw error;
}
async function resyncPush(){
  if(push.status!=="on" || !push.reg || !state.me) return;
  try{ const sub=await push.reg.pushManager.getSubscription(); if(sub) await saveSub(sub); }catch(e){}
}
async function enablePush(){
  try{
    const perm = await Notification.requestPermission();
    if(perm!=="granted"){ push.status = perm==="denied"?"denied":"off"; render(); return; }
    let sub = await push.reg.pushManager.getSubscription();
    if(!sub) sub = await push.reg.pushManager.subscribe({userVisibleOnly:true, applicationServerKey:b64ToU8(VAPID)});
    await saveSub(sub);
    push.status="on"; render(); toast("🔔 Meldingen staan aan op dit toestel");
  }catch(e){ toast("Meldingen aanzetten lukte niet"); }
}
async function disablePush(){
  try{
    const sub = await push.reg.pushManager.getSubscription();
    if(sub){ await state.sb.rpc("delete_push_subscription",{p_endpoint:sub.endpoint}); await sub.unsubscribe(); }
    push.status="off"; render(); toast("Meldingen uitgezet");
  }catch(e){ toast("Uitzetten lukte niet"); }
}
function renderPushCard(){
  const s=push.status;
  if(s==="unsupported") return "";
  const txt = {
    "ios-install":"Op iPhone werken meldingen alleen als app: tik op <b>Deel</b> ↑ → <b>Zet op beginscherm</b>, en open de agenda daarna via het icoon.",
    "denied":"Meldingen zijn geblokkeerd. Zet ze aan via de instellingen van je telefoon of browser.",
    "off":"Krijg een melding op dit toestel als er een aanvraag of goedkeuring is.",
    "on":`Meldingen staan aan op dit toestel voor <b>${esc(state.me)}</b>.`
  }[s];
  const btn = s==="off" ? `<button class="btn pri" data-push-on>Meldingen aanzetten</button>`
            : s==="on" ? `<button class="btn ghost" data-push-off>Uitzetten</button>` : "";
  return `<div class="req pushcard"><div class="top"><span class="pushic">🔔</span><div class="who">Pushmeldingen</div></div><p style="font-size:14px;color:#444">${txt}</p>${btn?`<div class="actions">${btn}</div>`:""}</div>`;
}

function renderInbox(){
  const w=waitingForMe();
  const otherPending=state.requests.filter(r=>r.by!==state.me&&statusOf(r)==="pending"&&(r.approvals||{})[state.me]);
  const recent=state.requests.filter(r=>r.by!==state.me&&statusOf(r)!=="pending").sort((a,b)=>(b.created||"").localeCompare(a.created||"")).slice(0,10);
  return `${renderPushCard()}<div class="sect">Wacht op jou</div>
    ${w.length?w.map(r=>reqCard(r,{vote:true})).join(""):`<div class="req emptytxt">Niets om goed te keuren 🎉</div>`}
    ${otherPending.length?`<div class="sect">Jij bent akkoord, wacht op de ander</div>${otherPending.map(r=>reqCard(r)).join("")}`:""}
    ${recent.length?`<div class="sect">Afgehandeld</div>${recent.map(r=>reqCard(r)).join("")}`:""}`;
}
function renderMine(){
  const mine=state.requests.filter(r=>r.by===state.me).sort((a,b)=>(b.created||"").localeCompare(a.created||""));
  return `<div class="sect">Mijn aanvragen</div>
    ${mine.length?mine.map(r=>reqCard(r,{cancel:true})).join(""):`<div class="req emptytxt">Je hebt nog niets aangevraagd.<br>Ga naar de agenda en tik op een dag.</div>`}`;
}

function renderSheet(){
  const sh=state.sheet; if(!sh) return "";
  let inner="";
  if(sh.type==="day"){
    const d=sh.d;
    const rows=SLOTS.map(s=>{
      const o=slotOwner(d,s.k);
      if(o){
        const lbl=o.st==="approved"?`${o.r.by}`:`${o.r.by} · wacht`;
        const n=itemOf(o.r,d,s.k)?.note||o.r.note;
        return `<div class="slotrow taken"><span class="ic">${s.ic}</span><div><div class="t">${s.label}</div><div class="s">${s.time}${n?` · “${esc(n)}”`:""}</div></div><span class="tag" style="background:${COLOR[o.r.by]};${o.st==="pending"?"opacity:.6":""}">${esc(lbl)}</span></div>`;
      }
      const p=isPicked(d,s.k);
      const pk=state.picked.find(x=>x.d===d&&x.s===s.k);
      return `<button class="slotrow free ${p?"picked":""}" data-pick="${d}|${s.k}"><span class="ic">${s.ic}</span><div><div class="t">${s.label}</div><div class="s">${s.time} · vrij</div></div><span class="chk">${p?"✓":""}</span></button>${pk?pnoteInput(pk):""}`;
    }).join("");
    inner=`<h3>${fmtDate(d,true)}</h3><p class="sub">Kies de dagdelen die je de auto nodig hebt.</p>${rows}
      <div class="actions"><button class="btn ghost" data-close>Klaar</button>${state.picked.length?`<button class="btn pri" data-open-send>Aanvragen (${state.picked.length})</button>`:""}</div>`;
  } else if(sh.type==="send"){
    inner=`<h3>Aanvraag versturen</h3><p class="sub">${others(state.me).join(" en ")} moeten allebei akkoord geven.</p>
      ${sortItems(state.picked).map(p=>`<div class="sendrow"><span class="chip">${fmtDate(p.d)} · ${slotLabel(p.s).toLowerCase()}</span>${pnoteInput(p)}</div>`).join("")}
      <textarea id="note" placeholder="Algemene opmerking bij de hele aanvraag (optioneel)" maxlength="300"></textarea>
      <div class="actions"><button class="btn ghost" data-close>Annuleren</button><button class="btn pri" data-send ${state.busy?"disabled":""}>Versturen</button></div>`;
  } else if(sh.type==="confirm"){
    inner=`<h3>Aanvraag intrekken?</h3><p class="sub">De dagdelen komen weer vrij voor de anderen.</p>
      <div class="actions"><button class="btn ghost" data-close>Nee</button><button class="btn no" data-do-cancel="${sh.id}">Intrekken</button></div>`;
  }
  return `<div class="scrim" data-scrim><div class="sheet">${inner}</div></div>`;
}

function render(){
  const app=document.getElementById("app");
  const noteVal=document.getElementById("note")?.value;
  if(!state.me){ app.innerHTML=renderLogin(); return; }
  const w=waitingForMe().length;
  const banner = state.mode==="local"
    ? `<div class="banner">Demo-modus: aanvragen worden alleen in dit venster bewaard en niet gedeeld.</div>`
    : state.loadNote ? `<div class="banner">De agenda is nog niet bereikbaar, even geduld…</div>` : "";
  const body = state.tab==="agenda"?renderMonth():state.tab==="inbox"?renderInbox():renderMine();
  const selbar = state.picked.length && !state.sheet
    ? `<div class="selbar"><div style="flex:1"><b>${state.picked.length} dagde${state.picked.length===1?"el":"len"} gekozen</b><small>${[...new Set(state.picked.map(p=>p.d))].length} dag(en)</small></div><button class="btn ghost" data-clear>Wissen</button><button class="btn pri" data-open-send>Aanvragen</button></div>` : "";
  app.innerHTML=`
    <header>
      <div class="brand"><div class="logo">${carSvg(22)}</div><div><h1>Auto-agenda</h1><small>Boris · Job · Mama — 2026</small></div></div>
      <button class="me" data-switch>${avatar(state.me)} ${state.me} ▾</button>
    </header>
    ${banner}
    <div class="tabs">
      <button class="tab ${state.tab==="agenda"?"on":""}" data-tab="agenda">Agenda</button>
      <button class="tab ${state.tab==="inbox"?"on":""}" data-tab="inbox">Meldingen${w?`<span class="badge">${w}</span>`:""}</button>
      <button class="tab ${state.tab==="mine"?"on":""}" data-tab="mine">Mijn aanvragen</button>
    </div>
    ${state.mode==="loading"&&!state.loadNote?`<p class="loading">Agenda laden…</p>`:""}
    ${body}
    ${selbar}
    ${renderSheet()}`;
  if(noteVal!=null && document.getElementById("note")) document.getElementById("note").value=noteVal;
}

document.addEventListener("input",e=>{
  const k=e.target.dataset?.pnote; if(!k) return;
  const [d,s]=k.split("|");
  const v=e.target.value;
  state.picked.filter(p=>p.d===d&&p.s===s).forEach(p=>p.note=v);
  document.querySelectorAll(`[data-pnote="${k}"]`).forEach(el=>{if(el!==e.target)el.value=v});
});
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-me],[data-tab],[data-mnav],[data-day],[data-pick],[data-close],[data-open-send],[data-send],[data-vote],[data-cancel],[data-do-cancel],[data-clear],[data-switch],[data-scrim],[data-push-on],[data-push-off]");
  if(!t) return;
  const ds=t.dataset;
  if("scrim" in ds){ if(e.target===t){state.sheet=null;render();} return; }
  if(ds.me) return setMe(ds.me);
  if(ds.tab){ state.tab=ds.tab; render(); return; }
  if(ds.mnav){ state.month=Math.min(11,Math.max(0,state.month+Number(ds.mnav))); render(); return; }
  if(ds.day){ state.sheet={type:"day",d:ds.day}; render(); return; }
  if(ds.pick){ const [d,s]=ds.pick.split("|"); togglePick(d,s); return; }
  if("close" in ds){ state.sheet=null; render(); return; }
  if("openSend" in ds){ state.sheet={type:"send"}; render(); setTimeout(()=>document.getElementById("note")?.focus(),50); return; }
  if("send" in ds) return sendRequest();
  if(ds.vote) return vote(ds.id,ds.vote);
  if(ds.cancel) return cancel(ds.cancel);
  if(ds.doCancel){ const id=ds.doCancel; state.sheet=null; return guarded(()=>updateReq(id,{cancelled:true}),"Aanvraag ingetrokken"); }
  if("pushOn" in ds) return enablePush();
  if("pushOff" in ds) return disablePush();
  if("clear" in ds){ state.picked=[]; render(); return; }
  if("switch" in ds){ state.me=null; render(); return; }
});

render();
initDb().then(initPush);
</script>
</body>
</html>
